name: quality

# Scans: Rust CVE advisories, Python lint+security, JS lint+format, secrets.
# SonarCloud job runs only when the user adds the SONAR_TOKEN repo secret
# (free for open source: sonarcloud.io -> import this repo).

on:
  push:
  pull_request:

jobs:
  rust-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      # Prebuilt binary install (~5s); the rustsec/audit-check action
      # hardcodes the repo root and cannot find core/Cargo.lock.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit

  python-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff bandit
      - run: ruff check verify-web
      # App code only: tests/ is intentionally excluded - assert_used (B101)
      # and attack-simulation subprocess calls (B603/B404) are expected in
      # red-team test files, and ruff would flag the same style there.
      - run: >
          bandit verify-web/app.py verify-web/verify.py verify-web/db.py
          verify-web/report.py verify-web/trust.py verify-web/sync_trust.py -q

  js-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: >
          npx -y prettier@latest --check verify-web/static/verify.js
          verify-web/static/index.html package/rise.js package/install.js
      - run: npx -y eslint@latest verify-web/static/verify.js package/rise.js package/install.js
      # KAT: canonical JSON + ES256 must match a real rise-core artifact.
      - run: >
          node verify-web/tests/kat_node.mjs &&
          node verify-web/tests/kat_registry_node.mjs

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # No base/head: on direct pushes they are equal and the diff mode
      # errors out. Full-history scan instead (~30s at this repo size).
      - uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # shellcheck ships preinstalled on ubuntu-latest runners.
      - run: |
          fail=0
          while IFS= read -r f; do
            shellcheck -S warning "$f" || fail=1
          done < <(git ls-files '*.sh')
          exit "$fail"

  python-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - run: pip-audit -r verify-web/requirements.txt

  fuzz-regression:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Deterministic replay of the committed seed corpus through the same
      # oracle the ASan fuzzer explores (core/src/fuzz_oracle.rs). Full
      # sanitizer fuzzing is a local nightly job (cargo +nightly fuzz run
      # parsers): runner nightlies currently break ASan with crt-static.
      - run: cargo test --test corpus_replay --locked

  cross-matrix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # ring (rustls) compiles C for the TARGET: apple targets need apple
      # clang (macos runner), musl needs musl-gcc. aarch64-musl stays a
      # release-time check (built on macOS with musl-cross toolchains).
      - name: musl cross toolchain
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q musl-tools
      - run: cargo check --locked --target ${{ matrix.target }}

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - run: cargo llvm-cov --lcov --output-path lcov.info --locked
        working-directory: core
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest pytest-cov
        working-directory: verify-web
      - run: python -m pytest tests/ -q --cov=. --cov-report=xml:coverage.xml --cov-report=term
        working-directory: verify-web
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            core/lcov.info
            verify-web/coverage.xml

  sonar:
    runs-on: ubuntu-latest
    env:
      # secrets context is not allowed in if: conditions (actionlint
      # enforces this), so the token is mapped to env here and the step
      # gates on env. Skips cleanly until the user: (1) adds the
      # SONAR_TOKEN repo secret, (2) disables Automatic Analysis in
      # SonarCloud (Administration -> Analysis Method) — CI scans and
      # automatic analysis conflict with each other.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: SonarCloud scan
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
