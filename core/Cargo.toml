[package]
name = "rise-core"
version = "0.2.0"
edition = "2021"

[lib]
name = "rise_core"
path = "src/lib.rs"
crate-type = ["lib", "cdylib"]

[[bin]]
name = "rise-core"
path = "src/main.rs"

[dependencies]
sha2 = "0.10"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
p256 = { version = "0.14.0", features = ["ecdsa", "pkcs8"] }
ed25519-dalek = "3.0.0"
rand = "0.9"
ureq = "3.4.2"
base64 = "0.23.1"
