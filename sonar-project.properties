# SonarCloud configuration. Enable from the user side once:
# 1. Import this repo at https://sonarcloud.io (free for open source).
# 2. Add the SONAR_TOKEN as a GitHub repo secret.
# The sonar job in .github/workflows/quality.yml then runs automatically.
sonar.organization=demiralpdev
sonar.projectKey=demiralpdev_.RISE
sonar.projectName=.RISE
sonar.sources=core/src,verify-web,bindings/daemon
sonar.tests=core/src,verify-web/tests
sonar.test.inclusions=**/test_*.py,**/*_test.rs,**/tests/**
sonar.exclusions=target/**,.venv/**,node_modules/**,**/*.log
sonar.sourceEncoding=UTF-8
sonar.coverage.reportPaths=core/lcov.info,verify-web/coverage.xml
